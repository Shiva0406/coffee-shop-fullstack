services:
  mysql:
    image: mysql:8.0
    container_name: coffee-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootCoffee123!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coffeeshop}
      MYSQL_USER: ${MYSQL_USER:-coffee_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CoffeeShop123!}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    image: ${DOCKERHUB_USERNAME}/coffee-shop-backend:${IMAGE_TAG:-v1}
    container_name: coffee-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coffeeshop}
      MYSQL_USER: ${MYSQL_USER:-coffee_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CoffeeShop123!}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USERNAME}/coffee-shop-frontend:${IMAGE_TAG:-v1}
    container_name: coffee-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
